[build]
  publish = "."
  command = ""

# ─── Proxy all API calls to Render backend ─────────────────
# Netlify rewrites /api/* → https://api.sios.live/api/:splat
# If api.sios.live is not yet configured, use the Render URL directly.

[[redirects]]
  from = "/api/*"
  to = "https://sioslive.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://sioslive.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/user/*"
  to = "https://sioslive.onrender.com/user/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://sioslive.onrender.com/health"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

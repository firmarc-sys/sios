body[data-phase="prime"] .brand{opacity:.42}body[data-phase="prime"] .orb-shell{bottom:clamp(42px,8vh,84px);width:clamp(118px,32vw,180px)}body[data-phase="prime"] .prompt{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(24px) scale(.9)}

<script>
(()=>{
'use strict';
const IDENTITY={gid:'399152573423',displayName:'Jorge Delgado',mode:'Prime Orchestrator',tier:'PRIME',permissions:['owner','admin','orchestrator','demo'],runtime:'SIOS / STARE Gateway',backend:'Vercel PM Backend',status:'AWAKE'};
const COMMAND='TAE, enter Demo Mode';
const body=document.body,canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:true});
const prompt=document.getElementById('prompt'),input=document.getElementById('command'),toast=document.getElementById('toast'),statusLine=document.getElementById('statusLine'),orbShell=document.getElementById('orbShell'),mic=document.getElementById('mic'),installBtn=document.getElementById('installBtn');
let W=0,H=0,DPR=1,t0=performance.now(),phase='idle',energy=.48,activated=false,deferredInstall=null,audioCtx=null,particles=[];
function setPhase(next){phase=next;body.dataset.phase=next;statusLine.textContent=`STATE: ${next.toUpperCase()} · BACKEND: VERCEL PM · GID: ${IDENTITY.gid}`;}
function showToast(text,ms=1800){toast.textContent=text;toast.classList.add('on');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('on'),ms)}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);seedParticles()}
function seedParticles(){const count=Math.min(760,Math.floor(W*H/1150));particles=Array.from({length:count},(_,i)=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),r:Math.random()*1.7+.35,v:(Math.random()*0.35+.08)*(Math.random()<.5?-1:1),a:Math.random()*6.283,i}))}
function draw(now){const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
 const cx=W*.5,cy=H*.70,orbR=Math.min(W*.245,132)*(phase==='prime'?.68:1);let g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.74);g.addColorStop(0,`rgba(0,20,60,${.18+energy*.10})`);g.addColorStop(.38,'rgba(0,5,18,.28)');g.addColorStop(1,'rgba(0,0,0,.62)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalCompositeOperation='screen';
 particles.forEach(p=>{let pull=(phase==='idle'?0:phase==='active'?.2:phase==='generate'?.5:.75);let targetY=cy-(Math.sin(p.i)*.5+.5)*H*.55;let dx=cx+(Math.sin(p.i*17.13+t*.22)*W*.34)-p.x;let dy=targetY-p.y;p.x+=dx*.0015*pull+Math.sin(t*.7+p.a)*.05;p.y+=p.v-(pull*dy*.001);if(p.y<-40)p.y=H+20;if(p.y>H+40)p.y=-20;if(p.x<-30)p.x=W+20;if(p.x>W+30)p.x=-20;let dist=Math.hypot(p.x-cx,p.y-cy),glow=Math.max(0,1-dist/(H*.75));let alpha=(.18+p.z*.55+glow*.38)*(phase==='prime'?1.2:1);ctx.fillStyle=`rgba(${155+p.z*90},${205+p.z*45},255,${alpha})`;ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.max(1,p.r),Math.max(1,p.r));});
 ctx.restore();
 if(phase!=='idle'){ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<20;i++){let a=(i/20)*Math.PI*2+t*.08;let x=cx+Math.cos(a)*orbR*(1.2+i*.032);let y=cy+Math.sin(a)*orbR*.36+Math.sin(t+i)*5;ctx.strokeStyle=`rgba(130,210,255,${.018+i*.002})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx+Math.cos(a+Math.PI)*W*.48,cy-H*.62);ctx.stroke()}ctx.restore()}
 ctx.save();ctx.translate(cx,cy+orbR*.64);ctx.scale(1,.23);for(let r=1;r<7;r++){ctx.strokeStyle=`rgba(130,210,255,${.11/r})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,orbR*(1.1+r*.32+Math.sin(t*1.3+r)*.04),0,Math.PI*2);ctx.stroke()}ctx.restore();
 requestAnimationFrame(draw)}
async function api(path,options={}){try{const res=await fetch(path,{headers:{'content-type':'application/json'},cache:'no-store',...options});return await res.json()}catch(e){return {ok:false,error:e.message,identity:IDENTITY,backend:'local fallback'}}}
function normalize(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
async function activate(source='tap'){if(activated)return;activated=true;setPhase('active');energy=.82;showToast('TAE COMMAND ACCEPTED');startAudio();
 const command=input.value.trim()||COMMAND;const tae=await api('/api/tae',{method:'POST',body:JSON.stringify({command,source,identity:IDENTITY})});
 setTimeout(()=>setPhase('generate'),620);setTimeout(async()=>{await Promise.all([api('/api/render-state'),api('/api/iot'),api('/api/syncori'),api('/api/identity',{method:'POST',body:JSON.stringify({gid:IDENTITY.gid,mode:IDENTITY.mode})})]);setPhase('prime');energy=1;showToast(`${IDENTITY.displayName} · ${IDENTITY.mode}`,2600)},1550);
 if(tae && tae.reply) statusLine.textContent=`STATE: ACTIVE · ${tae.reply}`}
function startAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;const master=audioCtx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.055,now+.6);master.gain.exponentialRampToValueAtTime(.018,now+8);master.connect(audioCtx.destination);[55,82.5,110,220].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();o.type=i%2?'triangle':'sine';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*(i===3?1.5:1.01),now+5+i*.3);filter.type='lowpass';filter.frequency.setValueAtTime(360+i*120,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08/(i+1),now+1.2+i*.2);g.gain.exponentialRampToValueAtTime(.001,now+9);o.connect(filter).connect(g).connect(master);o.start(now);o.stop(now+9.4)});}catch(e){}}
function beginVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('VOICE UNAVAILABLE · TAP OR TYPE');return}const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;mic.classList.add('listening');showToast('LISTENING FOR TAE');rec.onresult=e=>{const text=e.results[0][0].transcript;input.value=text;if(normalize(text)===normalize(COMMAND)||normalize(text).includes('tae enter demo mode'))activate('voice');else showToast('COMMAND HEARD · TAP ↑ TO SEND')};rec.onerror=()=>showToast('VOICE INTERRUPTED · TAP OR TYPE');rec.onend=()=>mic.classList.remove('listening');rec.start()}
setTimeout(()=>{prompt.classList.add('on');input.value='';showToast(COMMAND,2600);setPhase('idle')},2050);
prompt.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim()||COMMAND;if(normalize(text)===normalize(COMMAND)||normalize(text).includes('tae enter demo mode'))activate('type');else{input.value=COMMAND;showToast('PRIME DEMO COMMAND LOADED')}});
orbShell.addEventListener('click',()=>activate('orb'));orbShell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate('keyboard')}});mic.addEventListener('click',beginVoice);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.classList.add('on')});installBtn.addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installBtn.classList.remove('on')});
window.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px')},{passive:true});
window.addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(draw);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
})();
</script>

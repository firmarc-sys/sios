const glCanvas=$('gl'),flowCanvas=$('flow'),skinCanvas=$('skin');let gl,program,buffer,uniforms={},flowCtx,skinCtx,dpr=1,time0=performance.now();
function initGL(){gl=glCanvas.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:false});if(!gl)return false;const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';const fs=`precision highp float;uniform vec2 r;uniform float t;uniform float e;uniform float m;uniform float b;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*noise(p);p*=2.04;a*=.5;}return v;}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);uv.y-=.015;float breathe=1.+.024*sin(t*1.1)+e*.018;float warp=fbm(uv*2.8+vec2(t*.08,-t*.05))*.028*m;vec2 q=uv+normalize(uv+1e-4)*warp;float d=length(q/breathe);float orb=smoothstep(.535,.492,d);float rim=(smoothstep(.475,.535,d)-smoothstep(.535,.592,d));float ang=atan(q.y,q.x);float n=fbm(q*3.4+vec2(sin(t*.17),t*.12));float bands=.5+.5*sin(ang*5.5+q.y*10.0+t*.72+n*4.7);float bands2=.5+.5*sin((q.x-q.y)*20.0-t*1.2+n*2.2);float vertical=.5+.5*sin(q.y*28.0+t*1.4+n*3.0);vec3 chrome=mix(vec3(.015,.018,.022),vec3(.8,.86,.9),bands);chrome=mix(chrome,vec3(1.),pow(bands2,7.)*.95);chrome=mix(chrome,vec3(.08,.09,.1),pow(1.-vertical,4.)*.42);float hi=pow(max(0.,1.-length(q-vec2(-.18,.22))/.42),3.0);float cut=pow(max(0.,1.-length(q-vec2(.18,-.08))/.58),2.0);chrome+=hi*vec3(1.22);chrome-=cut*vec3(.5,.52,.55);chrome+=pow(max(rim,0.),1.5)*vec3(1.9);float mouth=smoothstep(.04,.0,abs(q.y+.545+sin(q.x*8.+t)*.008))*smoothstep(.74,.18,abs(q.x));chrome+=mouth*vec3(.95);float stream=smoothstep(.52,-.1,abs(q.x+sin(q.y*7.+t)*.035))*smoothstep(.66,-.2,q.y)*smoothstep(-1.0,.2,q.y);chrome+=vec3(.72,.8,.9)*(stream*.2*m);float alpha=orb+rim*.76+mouth*.5+stream*.15*m;alpha*=smoothstep(0.,.35,b+.15);gl_FragColor=vec4(chrome,alpha);}`;function sh(type,src){const x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader( function resize(){dpr=Math.min(devicePixelRatio||1,2);for(const c of [glCanvas,flowCanvas,skinCanvas]){c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}if(gl)gl.viewport(0,0,glCanvas.width,glCanvas.height);flowCtx=flowCanvas.getContext('2d');skinCtx=skinCanvas.getContext('2d');flowCtx.setTransform(dpr,0,0,dpr,0,0);skinCtx.setTransform(dpr,0,0,dpr,0,0)}
function drawFlow(t){const w=innerWidth,h=innerHeight;flowCtx.clearRect(0,0,w,h);flowCtx.globalCompositeOperation='lighter';for(let i=0;i<86;i++){const phase=i*11.91;const radius=w*(.035+.0032*(i%34));const x=w*.5+Math.sin(phase+t*.21)*radius;const y=h*.84-((t*(30+energy*42)+i*23)%(h*.96));const len=16+Math.sin(t+i)*18;const a=(.02+energy*.055)*(1-y/h+.25);const g=flowCtx.createLinearGradient(x,y+len,x,y-len);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,`rgba(245,250,255,${a})`);g.addColorStop(1,'rgba(255,255,255,0)');flowCtx.strokeStyle=g;flowCtx.lineWidth=.55+energy*1.25;flowCtx.beginPath();flowCtx.moveTo(x+Math.sin(y*.018+t)*10,y+len);flowCtx.quadraticCurveTo(x+Math.sin(t+i)*24,y,x+Math.cos(t+i)*9,y-len);flowCtx.stroke()}flowCtx.globalCompositeOperation='source-over'}

function loop(now){const t=(now-time0)/1000;const target=state==='idle'?.2:state==='active'?.9:1;energy+=(target-energy)*.028;melt+=((state==='idle'?0:1.22)-melt)*.022;birth+=(1-birth)*.018;document.documentElement.style.setProperty('--energy',energy.toFixed(3));document.documentElement.style.setProperty('--melt',melt.toFixed(3));document.documentElement.style.setProperty('--birth',birth.toFixed(3));if(gl){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform2f(uniforms.r,glCanvas.width,glCanvas.height);gl.uniform1f(uniforms.t,t);gl.uniform1f(uniforms.e,energy);gl.uniform1f(uniforms.m,melt);gl.uniform1f(uniforms.b,birth);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}drawFlow(t);drawSkin(t);requestAnimationFrame(loop)}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SIOS Runtime</title>

  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app">
    <div class="shell"></div>

    <div class="toast" id="toast">
      THIS IS NOT AN APP. THIS IS ME.<br>
      GID 399152573423 • PRIME ORCHESTRATOR
    </div>

    <section id="hero" class="view active">
      <div class="hero-copy">
        <h1>System Intelligence at the speed of self.</h1>
        <div class="enter" onclick="go('portal')">
          Enter SIOS
        </div>
      </div>

      <div class="core"></div>
    </section>

    <section id="portal" class="view">
      <div class="panel">
        <h1>GID PORTAL</h1>
      </div>
    </section>

    <section id="gate" class="view">
      <div class="panel">
        <h1>GID GATE</h1>
      </div>
    </section>

    <section id="launcher" class="view">
      <div class="panel">
        <h1>CORE APPS</h1>
        <div id="modules" class="module-grid"></div>
      </div>
    </section>

    <section id="child" class="view">
      <div class="panel">
        <h1 id="childTitle">MODULE</h1>
        <div id="childRows"></div>
      </div>
    </section>

    <div class="dock">
      <button onclick="child('TAE INTAKE')">TAE</button>
      <button onclick="child('RENDER STUDIO')">RENDER</button>
      <button onclick="child('SYNCORI')">SYNCORI</button>
      <button onclick="child('IDENTITY HUB')">IDENTITY</button>
    </div>

    <div class="bar">
      <span id="status">SYSTEM LIVE</span>
      <span>SCROLL TO EXPLORE</span>
    </div>
  </main>
</body>
</html>

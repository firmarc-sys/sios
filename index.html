  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

      width: 100%;

    }

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========== CANVAS UTILITIES ==========
    const CanvasUtils = {
      drawDiscoOrb: (ctx, x, y, radius, angle, tileCount = 12) => {
        ctx.save();
        ctx.translate(x, y);

        // Outer glow
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 1.2);
        gradient.addColorStop(0, 'rgba(100, 200, 255, 0.3)');
        gradient.addColorStop(1, 'rgba(100, 200, 255, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Main orb
        const orbGradient = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 0, 0, 0, radius);
        orbGradient.addColorStop(0, 'rgba(150, 220, 255, 0.9)');
        orbGradient.addColorStop(0.5, 'rgba(100, 200, 255, 0.7)');
        orbGradient.addColorStop(1, 'rgba(50, 100, 200, 0.5)');
        ctx.fillStyle = orbGradient;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Reflective tiles
        for (let i = 0; i < tileCount; i++) {
          const tileAngle = (angle + (i / tileCount) * Math.PI * 2) % (Math.PI * 2);
          const tx = Math.cos(tileAngle) * radius * 0.7;
          const ty = Math.sin(tileAngle) * radius * 0.7;
          ctx.fillStyle = `rgba(200, 230, 255, ${0.5 + Math.sin(angle * 2 + i) * 0.3})`;
          ctx.beginPath();
          ctx.arc(tx, ty, radius * 0.15, 0, Math.PI * 2);
          ctx.fill();
        }

        // Bright center
        const centerGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.3);
        centerGradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        centerGradient.addColorStop(1, 'rgba(100, 200, 255, 0)');
        ctx.fillStyle = centerGradient;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      },

      drawTeslaCoil: (ctx, x, y, angle) => {
        ctx.save();
        ctx.translate(x, y);

        for (let i = 0; i < 6; i++) {
          const lineAngle = (angle + (i * Math.PI) / 3) % (Math.PI * 2);
          const length = 40;
          const endX = Math.cos(lineAngle) * length;
          const endY = Math.sin(lineAngle) * length;

          ctx.strokeStyle = `rgba(100, 200, 255, ${0.5 + Math.sin(angle + i) * 0.3})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(endX, endY);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      },

      drawHolographicGrid: (ctx, width, height, gridSize = 40) => {
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.08)';
        ctx.lineWidth = 1;

        for (let x = 0; x < width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      },

      drawChromeBorder: (ctx, width, height, padding = 20) => {
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.3)';
        ctx.lineWidth = 3;
        ctx.strokeRect(padding, padding, width - padding * 2, height - padding * 2);
      },

      updateParticles: (ctx, particles) => {
        return particles
          .map((p) => ({
            ...p,
            x: p.x + p.vx,
            y: p.y + p.vy,
            vy: p.vy + 0.1,
            life: p.life - 1 / (60 * p.maxLife),
          }))
          .filter((p) => p.life > 0)
          .map((p) => {
            ctx.fillStyle = `rgba(100, 200, 255, ${p.life * 0.6})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            return p;
          });
      },

      updateRipples: (ctx, ripples) => {
        return ripples
          .map((r) => ({
            ...r,
            radius: r.radius + 3,
            opacity: 1 - r.radius / r.maxRadius,
          }))
          .filter((r) => r.opacity > 0)
          .map((r) => {
            ctx.strokeStyle = `rgba(100, 200, 255, ${r.opacity * 0.8})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.stroke();
            return r;
          });
      },

      emitParticles: (x, y, count = 3) => {
        const particles = [];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 2;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            maxLife: 1.5 + Math.random() * 1,
            size: 0.5 + Math.random() * 1.5,
          });
        }
        return particles;
      },
    };

    // ========== SCREEN: BOOT ==========
    function ScreenBoot({ onNavigate }) {
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const ripplesRef = useRef([]);
      const orbAngleRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const orbRadius = Math.min(canvas.width, canvas.height) * 0.15;

        const particleEmitInterval = setInterval(() => {
          particlesRef.current.push(...CanvasUtils.emitParticles(centerX, centerY, 2));
        }, 50);

        let animationId;
        const animate = () => {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          orbAngleRef.current += 0.005;

          CanvasUtils.drawTeslaCoil(ctx, centerX, centerY - canvas.height * 0.35, orbAngleRef.current);
          CanvasUtils.drawHolographicGrid(ctx, canvas.width, canvas.height);

          particlesRef.current = CanvasUtils.updateParticles(ctx, particlesRef.current);
          ripplesRef.current = CanvasUtils.updateRipples(ctx, ripplesRef.current);

          CanvasUtils.drawDiscoOrb(ctx, centerX, centerY, orbRadius, orbAngleRef.current);
          CanvasUtils.drawChromeBorder(ctx, canvas.width, canvas.height);

          animationId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationId);
          clearInterval(particleEmitInterval);
          window.removeEventListener('resize', resizeCanvas);
        };
      }, []);

      const handleOrbClick = () => {
        if (canvasRef.current) {
          const rect = canvasRef.current.getBoundingClientRect();
          ripplesRef.current.push({
            x: rect.width / 2,
            y: rect.height / 2,
            radius: 0,
            maxRadius: 150,
            opacity: 1,
          });
        }
      };

      return (
        <div className="w-screen h-screen bg-black overflow-hidden relative">
          <canvas ref={canvasRef} className="absolute inset-0 cursor-pointer" onClick={handleOrbClick} />
          <div className="absolute inset-0 pointer-events-none border-8 border-gray-800 rounded-3xl shadow-2xl" />
          <div className="absolute inset-0 flex flex-col items-center justify-between pointer-events-none">
            <div className="flex-1" />
            <div className="flex flex-col items-center gap-8 pointer-events-auto">
              <div className="text-center px-4">
                <h1 className="text-xl font-light tracking-widest text-blue-300">
                  System Intelligence at the speed of self.
                </h1>
              </div>
              <button
                onClick={() => onNavigate('gid-portal')}
                className="px-8 py-3 border-2 border-blue-400 text-blue-300 font-light tracking-widest uppercase text-sm transition-all duration-500 hover:bg-blue-400 hover:text-black hover:shadow-lg hover:shadow-blue-400"
              >
                Enter SIOS
              </button>
            </div>
            <div className="pb-12 text-center text-xs text-blue-400 opacity-50 pointer-events-auto">
              <p>GID 399152573423 • Prime Orchestrator</p>
            </div>
          </div>
        </div>
      );
    }

        const orbRadius = Math.min(canvas.width, canvas.height) * 0.1;

        const particleEmitInterval = setInterval(() => {
          particlesRef.current.push(...CanvasUtils.emitParticles(centerX, centerY, 2));
        }, 50);

        let animationId;
        const animate = () => {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          orbAngleRef.current += 0.004;

          CanvasUtils.drawTeslaCoil(ctx, centerX, centerY - 120, orbAngleRef.current);
          CanvasUtils.drawHolographicGrid(ctx, canvas.width, canvas.height, 50);
          particlesRef.current = CanvasUtils.updateParticles(ctx, particlesRef.current);
          CanvasUtils.drawDiscoOrb(ctx, centerX, centerY, orbRadius, orbAngleRef.current);
          CanvasUtils.drawChromeBorder(ctx, canvas.width, canvas.height);

          animationId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationId);
          clearInterval(particleEmitInterval);
          window.removeEventListener('resize', resizeCanvas);
        };
      }, []);

      return (
        <div className="w-screen h-screen bg-black overflow-hidden relative">
          <canvas ref={canvasRef} className="absolute inset-0" />
          <div className="absolute inset-0 pointer-events-none border-8 border-gray-800 rounded-3xl shadow-2xl" />

    // ========== SCREEN: RENDER STUDIO ==========
    function ScreenRenderStudio({ onNavigate }) {
      const [renderState, setRenderState] = useState({
        particles: true,
        grid: true,
        orb: true,
      });

      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const orbAngleRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const orbRadius = Math.min(canvas.width, canvas.height) * 0.1;

        const particleEmitInterval = setInterval(() => {
          if (renderState.particles) {
            particlesRef.current.push(...CanvasUtils.emitParticles(centerX, centerY, 1));
          }
        }, 75);

        let animationId;
        const animate = () => {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          orbAngleRef.current += 0.003;

          if (renderState.grid) {
            CanvasUtils.drawHolographicGrid(ctx, canvas.width, canvas.height, 60);
          }
          if (renderState.particles) {
            particlesRef.current = CanvasUtils.updateParticles(ctx, particlesRef.current);
          }
          if (renderState.orb) {
            CanvasUtils.drawDiscoOrb(ctx, centerX, centerY, orbRadius, orbAngleRef.current);
          }
          CanvasUtils.drawChromeBorder(ctx, canvas.width, canvas.height);

          animationId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationId);
          clearInterval(particleEmitInterval);
          window.removeEventListener('resize', resizeCanvas);
        };
      }, [renderState]);

      return (
        <div className="w-screen h-screen bg-black overflow-hidden relative">
          <canvas ref={canvasRef} className="absolute inset-0" />
          <div className="absolute inset-0 pointer-events-none border-8 border-gray-800 rounded-3xl shadow-2xl" />
          <div className="absolute inset-0 flex flex-col items-center justify-between pointer-events-auto p-4">
            <h1 className="text-2xl font-light tracking-widest text-blue-300 pt-8">Render Studio</h1>

            <div className="space-y-3 w-full max-w-xs">
              <label className="flex items-center gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  checked={renderState.particles}
                  onChange={(e) => setRenderState({ ...renderState, particles: e.target.checked })}
                  className="w-4 h-4"
                />
                <span className="text-blue-300 text-sm">Particle Lattice</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  checked={renderState.grid}
                  onChange={(e) => setRenderState({ ...renderState, grid: e.target.checked })}
                  className="w-4 h-4"
                />
                <span className="text-blue-300 text-sm">Holographic Grid</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  checked={renderState.orb}
                  onChange={(e) => setRenderState({ ...renderState, orb: e.target.checked })}
                  className="w-4 h-4"
                />
                <span className="text-blue-300 text-sm">Disco Orb</span>
              </label>
            </div>

            <button
              onClick={() => onNavigate('core-features')}
              className="px-6 py-2 border border-blue-400 text-blue-300 hover:bg-blue-400 hover:text-black transition"
            >
              Back
            </button>
          </div>
        </div>
      );
    }

          <div className="absolute inset-0 flex flex-col items-start justify-start pointer-events-auto p-4 overflow-y-auto">

            <div className="space-y-3 w-full max-w-xs">
              <div className="p-4 border border-blue-400 text-blue-300">
                <p className="text-blue-400 text-xs mb-2">GID</p>
                <p className="text-lg font-mono">399152573423</p>
              </div>
              <div className="p-4 border border-blue-400 text-blue-300">
                <p className="text-blue-400 text-xs mb-2">IDENTITY</p>
                <p>Jorge Carlos Delgado</p>
              </div>
              <div className="p-4 border border-blue-400 text-blue-300">
                <p className="text-blue-400 text-xs mb-2">MODE</p>
                <p>Prime Orchestrator</p>
              </div>
              <div className="p-4 border border-blue-400 text-blue-300">
                <p className="text-blue-400 text-xs mb-2">VAULT</p>

            <button

    // ========== MAIN APP ROUTER ==========
    function SiosApp() {
      const [currentScreen, setCurrentScreen] = useState('boot');
      const [history, setHistory] = useState([]);

      const handleNavigate = (screen) => {
        setHistory([...history, currentScreen]);
        setCurrentScreen(screen);
      };

      const renderScreen = () => {
        switch (currentScreen) {
          case 'boot':
            return <ScreenBoot onNavigate={handleNavigate} />;
          case 'gid-portal':
            return <ScreenGidPortal onNavigate={handleNavigate} />;
          case 'gid-gate':
            return <ScreenGidGate onNavigate={handleNavigate} />;
          case 'access-gate':
            return <ScreenAccessGate onNavigate={handleNavigate} />;
          case 'core-features':
            return <ScreenCoreFeatures onNavigate={handleNavigate} />;
          case 'holographic-boot':
            return <ScreenHolographicBoot onNavigate={handleNavigate} />;
          case 'spatial-dashboard':
            return <ScreenSpatialDashboard onNavigate={handleNavigate} />;
          case 'gid-portal-access':
            return <ScreenGidPortalAccess onNavigate={handleNavigate} />;
          case 'global-intel-map':
            return <ScreenGlobalIntelMap onNavigate={handleNavigate} />;
          case 'agent-network':
            return <ScreenAgentNetwork onNavigate={handleNavigate} />;
          case 'mission-control':
            return <ScreenMissionControl onNavigate={handleNavigate} />;
          case 'vault-access':
            return <ScreenVaultAccess onNavigate={handleNavigate} />;
          case 'ai-command':
            return <ScreenAiCommand onNavigate={handleNavigate} />;
          case 'tae-intake':
            return <ScreenTaeIntake onNavigate={handleNavigate} />;
          case 'render-studio':
            return <ScreenRenderStudio onNavigate={handleNavigate} />;
          case 'syncori':
            return <ScreenSyncori onNavigate={handleNavigate} />;
          case 'identity-hub':
            return <ScreenIdentityHub onNavigate={handleNavigate} />;
          default:
            return <ScreenBoot onNavigate={handleNavigate} />;
        }
      };

      return (
        <div className="w-screen h-screen bg-black overflow-hidden">
          {renderScreen()}

          {/* Bottom dock */}
          {currentScreen !== 'boot' && (
            <div className="fixed bottom-0 left-0 right-0 h-20 bg-black bg-opacity-90 border-t border-blue-400 border-opacity-30 flex items-center justify-around pointer-events-auto z-50">
              <button
                onClick={() => handleNavigate('tae-intake')}
                className="text-blue-300 hover:text-blue-100 transition text-xs uppercase font-light"
              >
                TAE
              </button>
              <button
                onClick={() => handleNavigate('render-studio')}
                className="text-blue-300 hover:text-blue-100 transition text-xs uppercase font-light"
              >
                Render
              </button>
              <button
                onClick={() => handleNavigate('syncori')}
                className="text-blue-300 hover:text-blue-100 transition text-xs uppercase font-light"
              >
                Syncori
              </button>
              <button
                onClick={() => handleNavigate('identity-hub')}
                className="text-blue-300 hover:text-blue-100 transition text-xs uppercase font-light"
              >
                Identity
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SiosApp />);
  </script>
</body>

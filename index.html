<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark"><link rel="manifest" href="/manifest.json">
<title>Jahorin Mercury — S.I.aaS</title><link rel="stylesheet" href="/css/mercury.css">
<script>
(() => {
  const h=location.hostname.toLowerCase();
  const hostRoute={
    'gid.siaas.space':'/onboarding/','gidme.space':'/home/','home.siaas.space':'/home/',
    'interweb.siaas.space':'/interweb/','augment.siaas.space':'/augment/','code.siaas.space':'/code/',
    'scribe.siaas.space':'/scribe/','optics.siaas.space':'/optics/','camera.siaas.space':'/optics/'
  };
  if(location.pathname==='/'&&hostRoute[h]) location.replace(hostRoute[h]);
})();
</script>
<script src="/js/runtime.js"></script><script>SIAAS.initPage('landing')</script>
<style>
.landing{background:#000}.landing .canon{object-fit:cover;filter:brightness(.72) contrast(1.12)}
.void{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 46%,transparent 0 30%,rgba(0,0,0,.15) 58%,#000 100%)}
.brand{position:absolute;z-index:5;left:8%;right:8%;top:8%;text-align:center;text-transform:uppercase;letter-spacing:.42em;color:#e9f7ff;text-shadow:0 0 16px rgba(160,220,255,.5);font-size:clamp(10px,2vw,14px)}
.title{position:absolute;z-index:6;left:7%;right:7%;top:65%;text-align:center}.title h1{margin:0;font-weight:300;letter-spacing:.14em;font-size:clamp(30px,8vw,56px);text-shadow:0 0 20px rgba(160,220,255,.35)}.title p{margin:10px 0 0;letter-spacing:.28em;font-size:clamp(9px,2.2vw,13px);color:#c4d7e4}
.enter{position:absolute;z-index:9;left:20%;right:20%;bottom:11%;height:6.2%;border-radius:999px;border:1px solid rgba(167,222,255,.75);background:linear-gradient(180deg,#0c1720ee,#02070bee);color:#fff;letter-spacing:.2em;font-size:clamp(11px,2.7vw,16px);box-shadow:inset 0 0 18px rgba(255,255,255,.08),0 0 28px rgba(21,135,255,.25)}
.tae{position:absolute;z-index:8;left:18%;right:18%;bottom:5.6%;display:flex;gap:6px}.tae input{min-width:0;flex:1;border:0;border-bottom:1px solid rgba(145,203,245,.35);background:transparent;color:#cfeeff;text-align:center;outline:0;font-size:10px;letter-spacing:.06em}.tae button{border:0;background:transparent;color:#8fcfff;font-size:10px}
.demoCard{position:absolute;z-index:20;left:8%;right:8%;top:34%;padding:18px;text-align:center;border:1px solid rgba(122,211,255,.65);background:rgba(0,4,8,.94);border-radius:18px;box-shadow:0 0 40px rgba(0,132,255,.22);display:none}.demoCard.show{display:block}.demoCard strong{display:block;font-size:20px;letter-spacing:.1em}.demoCard p{color:#bfeaff}
</style></head><body>
<main class="mercury-app landing" aria-label="Jahorin Mercury public entrance">
  <img class="canon" src="/assets/mercury-home.svg" alt="Jahorin Mercury living instrument">
  <div class="live-sheen"></div><div class="void"></div>
  <div class="brand">Jahorin Mercury · S.I.aaS</div>
  <div class="title"><h1>MERCURY</h1><p>AUTHENTICATED LIVING INSTRUMENT</p></div>
  <button class="enter" id="enter">ENTER MERCURY</button>
  <form class="tae" id="taeForm"><label class="sr" for="tae">TAE command</label><input id="tae" autocomplete="off" placeholder="TAE, enter Demo Mode"><button>RUN</button></form>
  <section class="demoCard" id="demoCard" role="status"><strong>GID 399152573423</strong><p>Prime Orchestrator</p><p>“This is not an app. This is me.”</p><button id="demoEnter">ENTER DEMO</button></section>
</main>
<script>
const card=document.querySelector('#demoCard');
document.querySelector('#enter').onclick=()=>SIAAS.openApp('onboarding');
document.querySelector('#taeForm').onsubmit=async e=>{e.preventDefault();const v=document.querySelector('#tae').value.trim();try{const r=await SIAAS.tae(v);if(r?.demo)card.classList.add('show')}catch(err){alert(err.message)}};
document.querySelector('#demoEnter').onclick=()=>SIAAS.openApp('home');
</script></body></html>
